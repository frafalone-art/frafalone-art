name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Forza GitHub a concedere i permessi di scrittura a questo specifico script:
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: thanhhaudev/github-stats@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_METRICS: "LANGUAGE_PER_REPO, COMMIT_TIMES_OF_DAY, COMMIT_DAYS_OF_WEEK"
