name: Metrics
on:
  # Si aggiorna automaticamente ogni 12 ore
  schedule: [{cron: "0 */12 * * *"}]
  # Ti permette di avviarlo a mano
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Questo token integrato ora funzionerà perfettamente
          token: ${{ secrets.GITHUB_TOKEN }}

          # Opzioni grafiche
          user: frafalone-art
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Rome
          
          # Mostra i linguaggi più usati dettagliati
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
