name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: frafalone-art
          template: classic
          
          # Disattiviamo la sezione base e teniamo solo l'estensione dei linguaggi
          base: ""
          
          # Configuriamo il calcolo totale dei linguaggi basato sui repository, non sui push
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          repositories_affiliations: owner, collaborator
