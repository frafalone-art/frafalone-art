name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Si aggiorna automaticamente ogni notte a mezzanotte
  workflow_dispatch: # Ti permette di avviarlo manualmente quando vuoi

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: thanhhaudev/github-stats@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Abbiamo inserito i valori corretti richiesti dal sistema:
          SHOW_METRICS: "LANGUAGE_PER_REPO, COMMIT_TIMES_OF_DAY, COMMIT_DAYS_OF_WEEK"
