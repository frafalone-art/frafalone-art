name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: frafalone-art
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Rome
          
          repositories_affiliations: owner, collaborator

          # NUOVA CONFIGURAZIONE LINGUAGGI COMPLETA DI PERCENTUALI
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage # Mostra byte e percentuali (%)
          plugin_languages_limit: 8                        # Mostra fino a 8 linguaggi diversi
          
          # Disattiviamo la scansione temporale dei push recenti 
          # per contare tutto il codice presente nell'intero account:
          plugin_languages_indepth: no
          plugin_languages_ignored: ""
